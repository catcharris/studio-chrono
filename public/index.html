<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STUDIO CHRONO — Acoustic Timer</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;500;700&family=Inter:wght@400;500;600;700&display=swap');

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100dvh;
            background: #08080a; color: #e4e4e7;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
        }

        .material-symbols-rounded { font-size: 20px; vertical-align: middle; }

        /* =========================================
           1. 로비 화면 (STUDIO CHRONO 유틸리티 위장)
           ========================================= */
        #lobbyScreen {
            position: absolute; inset: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 24px; background: radial-gradient(circle at 50% 30%, #14141c 0%, #08080a 100%);
            z-index: 100;
        }
        .app-badge {
            font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 3px;
            color: #71717a; border: 1px solid #27272a; padding: 4px 10px; border-radius: 20px;
            margin-bottom: 12px;
        }
        .app-title {
            font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 700;
            letter-spacing: 2px; margin: 0 0 6px 0; color: #f4f4f5;
        }
        .app-sub { font-size: 13px; color: #71717a; margin: 0 0 32px 0; }

        .lobby-card {
            width: 100%; max-width: 340px; background: rgba(24, 24, 27, 0.7);
            border: 1px solid #27272a; border-radius: 20px; padding: 24px;
            display: flex; flex-direction: column; gap: 14px;
            backdrop-filter: blur(12px);
        }
        .input-group label {
            display: block; font-family: 'JetBrains Mono', monospace;
            font-size: 11px; color: #a1a1aa; margin-bottom: 6px; letter-spacing: 1px;
        }
        .input-group input {
            width: 100%; padding: 14px 16px; border-radius: 12px;
            background: #09090b; border: 1px solid #27272a; color: #fff;
            font-family: 'JetBrains Mono', monospace; font-size: 15px; outline: none;
            user-select: text;
        }
        .input-group input:focus { border-color: #52525b; }

        .btn-primary {
            padding: 16px; border-radius: 12px; border: none;
            background: #f4f4f5; color: #09090b; font-weight: 600; font-size: 14px;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-secondary {
            padding: 15px; border-radius: 12px; border: 1px solid #27272a;
            background: #18181b; color: #d4d4d8; font-weight: 500; font-size: 14px;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-primary:active, .btn-secondary:active { transform: scale(0.98); }

        #lobbyStatus {
            font-family: 'JetBrains Mono', monospace; font-size: 11px;
            color: #71717a; text-align: center; margin-top: 4px;
        }

        /* =========================================
           2. 메인 워크스페이스 (공통 레이아웃)
           ========================================= */
        #mainScreen { position: absolute; inset: 0; display: none; background: #000; }

        /* 상단 미니 상태바 (매우 은밀하고 전문적인 디자인) */
        #topBar {
            position: absolute; top: max(12px, env(safe-area-inset-top)); left: 16px; right: 16px;
            display: flex; align-items: center; justify-content: space-between;
            z-index: 40; pointer-events: none;
        }
        .status-pill {
            pointer-events: auto; display: flex; align-items: center; gap: 8px;
            background: rgba(15, 15, 18, 0.85); border: 1px solid rgba(255,255,255,0.08);
            padding: 6px 12px; border-radius: 20px; font-family: 'JetBrains Mono', monospace;
            font-size: 11px; color: #a1a1aa; backdrop-filter: blur(8px);
        }
        .sync-dot {
            width: 8px; height: 8px; border-radius: 50%; background: #52525b;
            transition: background 0.3s, box-shadow 0.3s;
        }
        .sync-dot.online { background: #10b981; box-shadow: 0 0 8px #10b981; }
        .sync-dot.connecting { background: #f59e0b; }

        .mode-switcher {
            pointer-events: auto; display: flex; gap: 6px;
        }
        .mini-btn {
            background: rgba(24, 24, 27, 0.85); border: 1px solid rgba(255,255,255,0.1);
            color: #d4d4d8; padding: 6px 10px; border-radius: 10px; font-size: 11px;
            font-family: 'JetBrains Mono', monospace; cursor: pointer;
            display: flex; align-items: center; gap: 4px;
        }
        .mini-btn.active { background: #27272a; border-color: #52525b; color: #fff; }

        /* =========================================
           3. 지휘자용 스텔스 타이머 뷰 (STEALTH TIMER)
           ========================================= */
        #stealthDeck {
            position: absolute; inset: 0; display: none;
            flex-direction: column; align-items: center; justify-content: center;
            background: #050507; z-index: 25; padding: 20px;
        }
        .chrono-box {
            text-align: center; padding: 30px 20px; border-radius: 24px;
            width: 100%; max-width: 420px;
        }
        .real-clock {
            font-family: 'JetBrains Mono', monospace; font-size: 16px;
            color: #52525b; letter-spacing: 2px; margin-bottom: 8px;
        }
        .elapsed-timer {
            font-family: 'JetBrains Mono', monospace; font-size: clamp(54px, 15vw, 84px);
            font-weight: 300; color: #d4d4d8; letter-spacing: 2px; line-height: 1.1;
            margin: 10px 0; cursor: pointer;
        }
        .timer-controls {
            display: flex; justify-content: center; gap: 12px; margin-top: 16px;
        }
        .timer-btn {
            background: #121216; border: 1px solid #27272a; color: #71717a;
            padding: 8px 16px; border-radius: 8px; font-family: 'JetBrains Mono', monospace;
            font-size: 12px; cursor: pointer;
        }

        /* 무음 메모 (악보 코멘트처럼 자연스럽게 표시) */
        #stealthNoteBar {
            margin-top: 28px; min-height: 36px; width: 100%; max-width: 380px;
            border-top: 1px solid #18181b; padding-top: 12px;
            font-family: 'JetBrains Mono', monospace; font-size: 13px;
            color: #a1a1aa; text-align: center; transition: opacity 0.3s;
        }
        #stealthNoteText { color: #e4e4e7; }

        /* 스텔스 모드 내 초소형 PIP (옵션으로 켜고 끔) */
        .stealth-pip-hint {
            font-size: 11px; color: #3f3f46; margin-top: 20px;
            font-family: 'JetBrains Mono', monospace;
        }

        /* =========================================
           4. 비디오 레이아웃 (DUAL VIEW / MONITOR VIEW)
           ========================================= */
        #videoStage {
            position: absolute; inset: 0; display: flex;
            align-items: center; justify-content: center; overflow: hidden; z-index: 10;
        }
        /* 메인 원격 비디오 */
        #remoteVideo {
            width: 100%; height: 100%; object-fit: contain;
            transition: transform 0.25s ease;
        }

        /* 내 카메라 / 보조 PIP 박스 */
        #pipBox {
            position: absolute; bottom: max(95px, calc(env(safe-area-inset-bottom) + 85px)); right: 16px;
            width: 105px; height: 140px; border-radius: 16px; overflow: hidden;
            background: #121216; border: 1px solid rgba(255,255,255,0.18);
            box-shadow: 0 12px 30px rgba(0,0,0,0.8); z-index: 30;
            transition: all 0.25s ease; cursor: pointer;
        }
        #pipBox.stealth-mini {
            width: 68px; height: 90px; opacity: 0.35; border-color: rgba(255,255,255,0.08);
        }
        #pipBox.hidden-pip { opacity: 0; pointer-events: none; transform: scale(0.8); }
        #localVideo {
            width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1);
        }
        .pip-label {
            position: absolute; bottom: 6px; left: 8px;
            font-family: 'JetBrains Mono', monospace; font-size: 9px;
            color: rgba(255,255,255,0.7); background: rgba(0,0,0,0.6);
            padding: 2px 5px; border-radius: 4px;
        }

        /* 스텔스 모드에서 상대방 화면 살짝 보기 (Peek 비디오 오버레이) */
        #peekOverlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.92);
            z-index: 60; display: none; align-items: center; justify-content: center;
            flex-direction: column; pointer-events: none;
        }
        #peekVideo {
            width: 85vw; max-width: 400px; height: 65dvh;
            object-fit: cover; border-radius: 20px; border: 1px solid #3f3f46;
        }
        .peek-caption {
            margin-top: 12px; font-family: 'JetBrains Mono', monospace;
            font-size: 12px; color: #a1a1aa;
        }

        /* 완전 블랙아웃(암전) 오버레이 */
        #blackoutOverlay {
            position: fixed; inset: 0; background: #000000;
            z-index: 90; display: none; align-items: center; justify-content: center;
        }
        .blackout-dot {
            width: 4px; height: 4px; border-radius: 50%; background: #18181b;
        }

        /* =========================================
           5. 하단 컨트롤 독 (오디오 뮤트 / 카메라 전환 / 줌 / 메모)
           ========================================= */
        #bottomDock {
            position: absolute; bottom: max(20px, env(safe-area-inset-bottom));
            left: 50%; transform: translateX(-50%);
            display: flex; align-items: center; gap: 8px;
            background: rgba(18, 18, 22, 0.9); border: 1px solid rgba(255,255,255,0.1);
            padding: 8px 12px; border-radius: 24px; backdrop-filter: blur(16px);
            z-index: 45; max-width: 96vw; overflow-x: auto;
        }
        .dock-btn {
            background: #1f1f26; border: 1px solid #2e2e38; color: #e4e4e7;
            padding: 10px 12px; border-radius: 16px; font-size: 11px;
            font-family: 'JetBrains Mono', monospace; cursor: pointer;
            display: flex; align-items: center; gap: 6px; white-space: nowrap;
            transition: all 0.15s;
        }
        .dock-btn:active { transform: scale(0.95); }
        /* 위험/주의(스피커 켜짐 등) 및 안전(뮤트됨) 색상 구분 */
        .dock-btn.safe-muted { background: rgba(16, 185, 129, 0.12); border-color: rgba(16, 185, 129, 0.4); color: #34d399; }
        .dock-btn.live-warn { background: rgba(239, 68, 68, 0.18); border-color: rgba(239, 68, 68, 0.5); color: #f87171; }
        .dock-btn.mic-off { background: rgba(245, 158, 11, 0.15); border-color: rgba(245, 158, 11, 0.4); color: #fbbf24; }

        /* 모니터 전용 뷰 컨트롤 바 (회전/줌/확대) */
        #viewerTools {
            position: absolute; top: max(56px, calc(env(safe-area-inset-top) + 46px)); right: 16px;
            display: none; flex-direction: column; gap: 8px; z-index: 40;
        }
        .tool-circle {
            width: 40px; height: 40px; border-radius: 50%;
            background: rgba(24, 24, 27, 0.85); border: 1px solid rgba(255,255,255,0.15);
            color: #fff; display: flex; align-items: center; justify-content: center;
            cursor: pointer; backdrop-filter: blur(10px); font-family: 'JetBrains Mono', monospace; font-size: 11px;
        }
        .tool-circle:active { transform: scale(0.92); }

        /* 카메라 선택 모달 (전면 / 후면 / Insta360 X5 등) */
        #camModal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            z-index: 80; display: none; align-items: center; justify-content: center; padding: 20px;
        }
        .modal-box {
            width: 100%; max-width: 340px; background: #141418;
            border: 1px solid #27272a; border-radius: 20px; padding: 20px;
        }
        .modal-title {
            font-family: 'JetBrains Mono', monospace; font-size: 13px;
            color: #a1a1aa; margin-bottom: 14px; display: flex; justify-content: space-between;
        }
        .cam-list { display: flex; flex-direction: column; gap: 8px; }
        .cam-item {
            padding: 12px 14px; border-radius: 12px; background: #1f1f26;
            border: 1px solid #2e2e38; color: #fff; font-size: 13px;
            text-align: left; cursor: pointer; display: flex; align-items: center; justify-content: space-between;
        }
        .cam-item.selected { border-color: #10b981; color: #34d399; }

        /* 메모/메시지 입력 팝업 */
        #notePopup {
            position: absolute; bottom: max(82px, calc(env(safe-area-inset-bottom) + 72px));
            left: 50%; transform: translateX(-50%);
            width: min(92vw, 380px); background: rgba(20, 20, 25, 0.95);
            border: 1px solid #3f3f46; border-radius: 18px; padding: 8px 10px;
            display: none; align-items: center; gap: 8px; z-index: 50;
            backdrop-filter: blur(16px);
        }
        #noteInput {
            flex: 1; background: transparent; border: none; color: #fff;
            font-size: 14px; outline: none; padding: 6px; user-select: text;
        }
        .note-send-btn {
            background: #e4e4e7; color: #09090b; border: none;
            border-radius: 12px; padding: 8px 12px; font-weight: 600; font-size: 12px; cursor: pointer;
        }

        /* 모니터 화면에 표시되는 자막형 메시지 */
        #floatingMsg {
            position: absolute; top: max(60px, calc(env(safe-area-inset-top) + 50px));
            left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.75); border: 1px solid rgba(255,255,255,0.15);
            padding: 8px 16px; border-radius: 20px; font-size: 14px; color: #fff;
            z-index: 45; display: none; pointer-events: none; white-space: nowrap;
        }
    </style>
</head>
<body>

    <!-- 1. 로비 화면 (완벽한 리허설 유틸리티 위장) -->
    <div id="lobbyScreen">
        <div class="app-badge">ACOUSTIC SYNC v2.4</div>
        <h1 class="app-title">STUDIO CHRONO</h1>
        <p class="app-sub">Precision Rehearsal Timer & Monitor</p>

        <div class="lobby-card">
            <div class="input-group">
                <label>SESSION CODE</label>
                <input type="text" id="sessionInput" value="rehearsal-01" autocomplete="off">
            </div>

            <!-- 지휘자(나) 입장 버튼 -->
            <button class="btn-primary" onclick="startSession('master')">
                <span class="material-symbols-rounded">timer</span>
                MASTER (TIMER & SYNC)
            </button>

            <!-- 모니터(상대방) 입장 버튼 -->
            <button class="btn-secondary" onclick="startSession('monitor')">
                <span class="material-symbols-rounded">visibility</span>
                MONITOR (VIEWER)
            </button>

            <div id="lobbyStatus">READY FOR SESSION</div>
        </div>
    </div>

    <!-- 2. 메인 화면 -->
    <div id="mainScreen">
        <!-- 상단 상태 표시줄 -->
        <div id="topBar">
            <div class="status-pill">
                <div id="syncDot" class="sync-dot"></div>
                <span id="syncText">STANDBY</span>
            </div>

            <div class="mode-switcher">
                <button id="btnStealthMode" class="mini-btn" onclick="setDisplayMode('stealth')">
                    <span class="material-symbols-rounded" style="font-size:15px;">schedule</span>TIMER
                </button>
                <button id="btnVideoMode" class="mini-btn" onclick="setDisplayMode('video')">
                    <span class="material-symbols-rounded" style="font-size:15px;">grid_view</span>VIEW
                </button>
                <button id="btnBlackoutMode" class="mini-btn" onclick="setDisplayMode('blackout')">
                    <span class="material-symbols-rounded" style="font-size:15px;">dark_mode</span>DIM
                </button>
            </div>
        </div>

        <!-- 3. 지휘자용 스텔스 타이머 덱 -->
        <div id="stealthDeck">
            <div class="chrono-box">
                <div id="realClock" class="real-clock">00:00:00</div>
                <!-- 숫자를 누르고 있으면(Touch & Hold) 상대방 얼굴이 팝업으로 보임 -->
                <div id="elapsedTimer" class="elapsed-timer">00:00</div>
                <div class="timer-controls">
                    <button class="timer-btn" onclick="toggleChrono()" id="chronoToggleBtn">PAUSE</button>
                    <button class="timer-btn" onclick="resetChrono()">RESET</button>
                    <button class="timer-btn" onclick="toggleStealthPip()" id="pipToggleBtn">PIP: OFF</button>
                </div>
                <div id="stealthNoteBar">
                    MEMO: <span id="stealthNoteText">—</span>
                </div>
                <div class="stealth-pip-hint">HOLD TIMER NUMBERS TO PEEK MONITOR</div>
            </div>
        </div>

        <!-- 4. 비디오 스테이지 -->
        <div id="videoStage">
            <video id="remoteVideo" autoplay playsinline></video>
        </div>

        <!-- 내 카메라 (또는 스텔스 모드 시 초소형 PIP) -->
        <div id="pipBox" onclick="swapMainAndPip()">
            <video id="localVideo" autoplay playsinline muted></video>
            <div class="pip-label" id="pipLabel">CAM</div>
        </div>

        <!-- 타이머 홀드 시 순간적으로 보여주는 Peek 오버레이 -->
        <div id="peekOverlay">
            <video id="peekVideo" autoplay playsinline muted></video>
            <div class="peek-caption">RELEASE TO RETURN TO TIMER</div>
        </div>

        <!-- 완전 암전(Blackout) 오버레이 (더블클릭/더블탭 시 해제) -->
        <div id="blackoutOverlay" onclick="handleBlackoutTap()">
            <div class="blackout-dot"></div>
        </div>

        <!-- 모니터용 화면 회전 / 줌 / 좌우반전 툴 -->
        <div id="viewerTools">
            <button class="tool-circle" onclick="rotateRemoteVideo()" title="90도 회전">
                <span class="material-symbols-rounded">rotate_right</span>
            </button>
            <button class="tool-circle" onclick="zoomRemoteVideo()" id="zoomBtn" title="확대/축소">
                1x
            </button>
            <button class="tool-circle" onclick="mirrorRemoteVideo()" title="좌우반전">
                <span class="material-symbols-rounded">flip</span>
            </button>
            <button class="tool-circle" onclick="requestRemoteCamSwitch()" title="상대 카메라 전환 요청">
                <span class="material-symbols-rounded">cameraswitch</span>
            </button>
        </div>

        <!-- 모니터용 플로팅 알림 -->
        <div id="floatingMsg"></div>

        <!-- 무음 메모 입력창 -->
        <div id="notePopup">
            <input type="text" id="noteInput" placeholder="무음 메모 전송..." onkeypress="if(event.key==='Enter') sendNote()">
            <button class="note-send-btn" onclick="sendNote()">SEND</button>
        </div>

        <!-- 5. 하단 컨트롤 독 -->
        <div id="bottomDock">
            <!-- 상대방 소리 듣기/끄기 (지휘자는 기본 OFF로 절대 안전 보장) -->
            <button id="btnSpeaker" class="dock-btn safe-muted" onclick="toggleRemoteAudio()">
                <span class="material-symbols-rounded" id="iconSpeaker">volume_off</span>
                <span id="labelSpeaker">SPK: MUTE</span>
            </button>

            <!-- 내 마이크 켜기/끄기 -->
            <button id="btnMic" class="dock-btn" onclick="toggleLocalMic()">
                <span class="material-symbols-rounded" id="iconMic">mic</span>
                <span id="labelMic">MIC: ON</span>
            </button>

            <!-- 카메라 전환 (전면 / 후면 / Insta360 X5) -->
            <button id="btnCam" class="dock-btn" onclick="openCamModal()">
                <span class="material-symbols-rounded">videocam</span>
                <span id="labelCam">SENSOR</span>
            </button>

            <!-- 합창 원음 모드 토글 -->
            <button id="btnMusicMode" class="dock-btn" onclick="toggleMusicAudioMode()">
                <span class="material-symbols-rounded">graphic_eq</span>
                <span id="labelMusicMode">RAW: ON</span>
            </button>

            <!-- 무음 메모 열기 -->
            <button class="dock-btn" onclick="toggleNotePopup()">
                <span class="material-symbols-rounded">edit_note</span>
                <span>MEMO</span>
            </button>
        </div>

        <!-- 카메라 센서 선택 모달 (아이폰 전면/후면 및 Insta360 X5 자동 감지) -->
        <div id="camModal" onclick="if(event.target===this) closeCamModal()">
            <div class="modal-box">
                <div class="modal-title">
                    <span>SELECT VIDEO SENSOR</span>
                    <span style="cursor:pointer;" onclick="closeCamModal()">✕</span>
                </div>
                <div class="cam-list" id="camListContainer">
                    <!-- JS에서 동적 생성 -->
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
