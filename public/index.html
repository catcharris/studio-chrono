<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>STUDIO CHRONO — Acoustic Timer</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;500;700&family=Inter:wght@400;500;600;700&display=swap');

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: manipulation;
        }
        body, html {
            position: fixed;
            inset: 0;
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #08080a; color: #e4e4e7;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
            overscroll-behavior: none;
        }

        .material-symbols-rounded { font-size: 18px; vertical-align: middle; }

        /* =========================================
           1. 로비 화면
           ========================================= */
        #lobbyScreen {
            position: absolute; inset: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px; background: radial-gradient(circle at 50% 30%, #14141c 0%, #08080a 100%);
            z-index: 100;
        }
        .app-badge {
            font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 3px;
            color: #71717a; border: 1px solid #27272a; padding: 4px 10px; border-radius: 20px;
            margin-bottom: 12px;
        }
        .app-title {
            font-family: 'JetBrains Mono', monospace; font-size: 26px; font-weight: 700;
            letter-spacing: 2px; margin: 0 0 6px 0; color: #f4f4f5;
        }
        .app-sub { font-size: 12px; color: #71717a; margin: 0 0 24px 0; }

        .lobby-card {
            width: 100%; max-width: 320px; background: rgba(24, 24, 27, 0.75);
            border: 1px solid #27272a; border-radius: 20px; padding: 20px;
            display: flex; flex-direction: column; gap: 12px;
            backdrop-filter: blur(12px);
        }
        .input-group label {
            display: block; font-family: 'JetBrains Mono', monospace;
            font-size: 11px; color: #a1a1aa; margin-bottom: 6px; letter-spacing: 1px;
        }
        .input-group input {
            width: 100%; padding: 13px 14px; border-radius: 12px;
            background: #09090b; border: 1px solid #27272a; color: #fff;
            font-family: 'JetBrains Mono', monospace; font-size: 16px;
            outline: none; user-select: text; -webkit-user-select: text;
        }
        .input-group input:focus { border-color: #52525b; }

        .btn-primary {
            padding: 14px; border-radius: 12px; border: none;
            background: #f4f4f5; color: #09090b; font-weight: 600; font-size: 13px;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-secondary {
            padding: 14px; border-radius: 12px; border: 1px solid #27272a;
            background: #18181b; color: #d4d4d8; font-weight: 500; font-size: 13px;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-primary:active, .btn-secondary:active { transform: scale(0.98); }

        #lobbyStatus {
            font-family: 'JetBrains Mono', monospace; font-size: 11px;
            color: #71717a; text-align: center; margin-top: 4px;
        }

        /* =========================================
           2. 메인 워크스페이스 (아이폰 12 미니 375px 완벽 대응)
           ========================================= */
        #mainScreen { position: fixed; inset: 0; display: none; background: #000; overflow: hidden; }

        /* 상단 미니 상태바 (절대 두 줄로 안 넘어가는 슬림 레이아웃) */
        #topBar {
            position: absolute; top: max(10px, env(safe-area-inset-top)); left: 10px; right: 10px;
            display: flex; align-items: center; justify-content: space-between; gap: 6px;
            z-index: 40; pointer-events: none; white-space: nowrap;
        }
        .status-pill {
            pointer-events: auto; display: flex; align-items: center; gap: 6px;
            background: rgba(15, 15, 18, 0.85); border: 1px solid rgba(255,255,255,0.08);
            padding: 5px 10px; border-radius: 16px; font-family: 'JetBrains Mono', monospace;
            font-size: 10px; color: #a1a1aa; backdrop-filter: blur(8px); flex-shrink: 0;
        }
        .sync-dot {
            width: 7px; height: 7px; border-radius: 50%; background: #52525b;
            transition: background 0.3s, box-shadow 0.3s; flex-shrink: 0;
        }
        .sync-dot.online { background: #10b981; box-shadow: 0 0 8px #10b981; }
        .sync-dot.connecting { background: #f59e0b; }

        /* 마스터 전용 상단 화면 모드 스위처 */
        #masterModeSwitcher { pointer-events: auto; display: none; gap: 4px; flex-shrink: 0; }
        .mini-btn {
            background: rgba(24, 24, 27, 0.85); border: 1px solid rgba(255,255,255,0.1);
            color: #d4d4d8; padding: 5px 8px; border-radius: 8px; font-size: 10px;
            font-family: 'JetBrains Mono', monospace; cursor: pointer;
            display: flex; align-items: center; gap: 3px; white-space: nowrap;
        }
        .mini-btn .material-symbols-rounded { font-size: 14px; }
        .mini-btn.active { background: #27272a; border-color: #10b981; color: #fff; }

        /* =========================================
           3. 모니터 전용 카메라 전환 탭 (지휘자 / 합창단 딱 2개만 깔끔하게!)
           ========================================= */
        #channelBar {
            position: absolute; top: max(48px, calc(env(safe-area-inset-top) + 40px));
            left: 50%; transform: translateX(-50%);
            display: none; align-items: center; gap: 4px;
            background: rgba(15, 15, 20, 0.88); border: 1px solid rgba(255,255,255,0.12);
            padding: 4px 6px; border-radius: 14px; z-index: 42;
            backdrop-filter: blur(12px); white-space: nowrap;
        }
        .ch-btn {
            background: transparent; border: 1px solid transparent; color: #a1a1aa;
            padding: 5px 12px; border-radius: 10px; font-size: 11px;
            font-family: 'JetBrains Mono', monospace; cursor: pointer;
            display: flex; align-items: center; gap: 5px; white-space: nowrap;
        }
        .ch-btn.active {
            background: rgba(16, 185, 129, 0.16); border-color: rgba(16, 185, 129, 0.5); color: #34d399; font-weight: 600;
        }
        .ch-badge {
            width: 6px; height: 6px; border-radius: 50%; background: #10b981; display: none;
        }
        .ch-badge.live { display: inline-block; }

        /* =========================================
           4. 지휘자용 스텔스 타이머 뷰 (STEALTH TIMER)
           ========================================= */
        #stealthDeck {
            position: absolute; inset: 0; display: none;
            flex-direction: column; align-items: center; justify-content: center;
            background: #050507; z-index: 25; padding: 20px;
        }
        .chrono-box {
            text-align: center; padding: 24px 16px; border-radius: 24px;
            width: 100%; max-width: 380px;
        }
        .real-clock {
            font-family: 'JetBrains Mono', monospace; font-size: 15px;
            color: #52525b; letter-spacing: 2px; margin-bottom: 6px;
        }
        .elapsed-timer {
            font-family: 'JetBrains Mono', monospace; font-size: clamp(50px, 15vw, 80px);
            font-weight: 300; color: #d4d4d8; letter-spacing: 2px; line-height: 1.1;
            margin: 8px 0; cursor: pointer;
        }
        .timer-controls {
            display: flex; justify-content: center; gap: 8px; margin-top: 14px;
        }
        .timer-btn {
            background: #121216; border: 1px solid #27272a; color: #71717a;
            padding: 7px 14px; border-radius: 8px; font-family: 'JetBrains Mono', monospace;
            font-size: 11px; cursor: pointer;
        }

        #stealthNoteBar {
            margin-top: 24px; min-height: 32px; width: 100%; max-width: 340px;
            border-top: 1px solid #18181b; padding-top: 12px;
            font-family: 'JetBrains Mono', monospace; font-size: 12px;
            color: #a1a1aa; text-align: center;
        }
        #stealthNoteText { color: #e4e4e7; }
        .stealth-pip-hint {
            font-size: 10px; color: #3f3f46; margin-top: 16px;
            font-family: 'JetBrains Mono', monospace;
        }

        /* =========================================
           5. 비디오 스테이지 & PIP
           ========================================= */
        #videoStage {
            position: absolute; inset: 0; display: flex;
            align-items: center; justify-content: center; overflow: hidden; z-index: 10;
        }
        #remoteVideo {
            width: 100%; height: 100%; object-fit: contain;
            transition: transform 0.2s ease-out;
        }

        #pipContainer {
            position: absolute; bottom: max(84px, calc(env(safe-area-inset-bottom) + 74px)); right: 12px;
            display: flex; flex-direction: column; gap: 8px; z-index: 30;
        }
        .pip-card {
            position: relative; width: 90px; height: 120px; border-radius: 14px; overflow: hidden;
            background: #121216; border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 12px 28px rgba(0,0,0,0.8); cursor: pointer;
            transition: all 0.25s ease;
        }
        .pip-card.stealth-mini {
            width: 68px; height: 90px; opacity: 0.45; border-color: rgba(255,255,255,0.12);
        }
        .pip-card.hidden-pip { display: none !important; }
        .pip-card video { width: 100%; height: 100%; object-fit: cover; }
        .pip-label {
            position: absolute; bottom: 5px; left: 6px;
            font-family: 'JetBrains Mono', monospace; font-size: 9px;
            color: rgba(255,255,255,0.85); background: rgba(0,0,0,0.65);
            padding: 2px 5px; border-radius: 4px;
        }

        /* 스텔스 홀드 Peek 오버레이 */
        #peekOverlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.92);
            z-index: 60; display: none; align-items: center; justify-content: center;
            flex-direction: column; pointer-events: none;
        }
        #peekVideo {
            width: 85vw; max-width: 360px; height: 65dvh;
            object-fit: cover; border-radius: 20px; border: 1px solid #3f3f46;
        }
        .peek-caption {
            margin-top: 12px; font-family: 'JetBrains Mono', monospace;
            font-size: 11px; color: #a1a1aa;
        }

        /* 블랙아웃 오버레이 */
        #blackoutOverlay {
            position: fixed; inset: 0; background: #000000;
            z-index: 90; display: none; align-items: center; justify-content: center;
        }
        .blackout-dot { width: 4px; height: 4px; border-radius: 50%; background: #18181b; }

        /* =========================================
           6. 모니터 우측 툴바 & 하단 컨트롤 독 (아이폰 12 미니 폭 안에 100% 쏙 들어오게 설계!)
           ========================================= */
        #viewerTools {
            position: absolute; top: max(96px, calc(env(safe-area-inset-top) + 86px)); right: 12px;
            display: none; flex-direction: column; gap: 8px; z-index: 40;
        }
        .tool-circle {
            width: 36px; height: 36px; border-radius: 50%;
            background: rgba(24, 24, 27, 0.85); border: 1px solid rgba(255,255,255,0.15);
            color: #fff; display: flex; align-items: center; justify-content: center;
            cursor: pointer; backdrop-filter: blur(10px); font-family: 'JetBrains Mono', monospace; font-size: 10px;
        }
        .tool-circle:active { transform: scale(0.92); }

        /* 하단 컨트롤 독: 가로 스크롤이나 화면 삐져나감 없이 중앙에 딱 맞게 배치! */
        #bottomDock {
            position: absolute; bottom: max(14px, env(safe-area-inset-bottom));
            left: 10px; right: 10px;
            margin: 0 auto;
            width: fit-content;
            max-width: calc(100vw - 20px);
            display: flex; align-items: center; justify-content: center; gap: 5px;
            background: rgba(18, 18, 22, 0.92); border: 1px solid rgba(255,255,255,0.1);
            padding: 6px 8px; border-radius: 18px; backdrop-filter: blur(16px);
            z-index: 45;
        }
        .dock-btn {
            background: #1f1f26; border: 1px solid #2e2e38; color: #e4e4e7;
            padding: 8px 9px; border-radius: 12px; font-size: 10px;
            font-family: 'JetBrains Mono', monospace; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 4px;
            white-space: nowrap; flex-shrink: 1;
        }
        .dock-btn .material-symbols-rounded { font-size: 16px; }
        .dock-btn:active { transform: scale(0.95); }
        .dock-btn.safe-muted { background: rgba(16, 185, 129, 0.12); border-color: rgba(16, 185, 129, 0.4); color: #34d399; }
        .dock-btn.live-warn { background: rgba(239, 68, 68, 0.18); border-color: rgba(239, 68, 68, 0.5); color: #f87171; }
        .dock-btn.mic-off { background: rgba(245, 158, 11, 0.15); border-color: rgba(245, 158, 11, 0.4); color: #fbbf24; }
        .dock-btn.pip-active { background: rgba(59, 130, 246, 0.18); border-color: rgba(59, 130, 246, 0.5); color: #60a5fa; }

        /* 모달 공통 */
        .modal-backdrop {
            position: fixed; inset: 0; background: rgba(0,0,0,0.82);
            z-index: 80; display: none; align-items: center; justify-content: center; padding: 20px;
        }
        .modal-box {
            width: 100%; max-width: 330px; background: #141418;
            border: 1px solid #27272a; border-radius: 20px; padding: 18px;
        }
        .modal-title {
            font-family: 'JetBrains Mono', monospace; font-size: 12px;
            color: #a1a1aa; margin-bottom: 14px; display: flex; justify-content: space-between;
        }
        .cam-list { display: flex; flex-direction: column; gap: 8px; }
        .cam-item {
            padding: 12px 14px; border-radius: 12px; background: #1f1f26;
            border: 1px solid #2e2e38; color: #fff; font-size: 13px;
            text-align: left; cursor: pointer; display: flex; align-items: center; justify-content: space-between;
        }
        .cam-item.selected { border-color: #10b981; color: #34d399; }

        /* 메모 입력 팝업 */
        #notePopup {
            position: absolute; bottom: max(70px, calc(env(safe-area-inset-bottom) + 60px));
            left: 50%; transform: translateX(-50%);
            width: min(92vw, 350px); background: rgba(20, 20, 25, 0.95);
            border: 1px solid #3f3f46; border-radius: 16px; padding: 6px 8px;
            display: none; align-items: center; gap: 6px; z-index: 50;
            backdrop-filter: blur(16px);
        }
        #noteInput {
            flex: 1; background: transparent; border: none; color: #fff;
            font-size: 16px;
            outline: none; padding: 6px; user-select: text; -webkit-user-select: text;
        }
        .note-send-btn {
            background: #e4e4e7; color: #09090b; border: none;
            border-radius: 10px; padding: 8px 12px; font-weight: 600; font-size: 12px; cursor: pointer;
        }

        #floatingMsg {
            position: absolute; top: max(92px, calc(env(safe-area-inset-top) + 82px));
            left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.18);
            padding: 6px 14px; border-radius: 20px; font-size: 12px; color: #fff;
            z-index: 48; display: none; pointer-events: none; white-space: nowrap;
        }
    </style>
</head>
<body>

    <!-- 1. 로비 화면 -->
    <div id="lobbyScreen">
        <div class="app-badge">ACOUSTIC SYNC v3.8</div>
        <h1 class="app-title">STUDIO CHRONO</h1>
        <p class="app-sub">Precision Rehearsal Timer & Monitor</p>

        <div class="lobby-card">
            <div class="input-group">
                <label>SESSION CODE</label>
                <input type="text" id="sessionInput" value="rehearsal-01" autocomplete="off">
            </div>

            <button class="btn-primary" onclick="startSession('master')">
                <span class="material-symbols-rounded">timer</span>
                MASTER (CONDUCTOR)
            </button>

            <button class="btn-secondary" onclick="startSession('monitor')">
                <span class="material-symbols-rounded">visibility</span>
                MONITOR (VIEWER)
            </button>

            <div id="lobbyStatus">READY FOR SESSION</div>
        </div>
    </div>

    <!-- 2. 메인 화면 -->
    <div id="mainScreen">
        <!-- 상단 상태 표시줄 (아이폰 12 미니 한 줄 고정) -->
        <div id="topBar">
            <div class="status-pill">
                <div id="syncDot" class="sync-dot"></div>
                <span id="syncText">READY</span>
            </div>

            <!-- 마스터 전용 상단 화면 모드 전환 버튼 -->
            <div id="masterModeSwitcher">
                <button id="btnStealthMode" class="mini-btn" onclick="setDisplayMode('stealth')">
                    <span class="material-symbols-rounded">schedule</span>TIMER
                </button>
                <button id="btnVideoMode" class="mini-btn" onclick="setDisplayMode('video')">
                    <span class="material-symbols-rounded">grid_view</span>VIEW
                </button>
                <button id="btnBlackoutMode" class="mini-btn" onclick="setDisplayMode('blackout')">
                    <span class="material-symbols-rounded">dark_mode</span>DIM
                </button>
            </div>
        </div>

        <!-- 3. 뷰어(MONITOR) 전용: 지휘자 / 합창단 딱 2개 탭만 깔끔하게 표시! -->
        <div id="channelBar">
            <button id="chMasterFront" class="ch-btn active" onclick="selectViewerChannel('master-front')">
                <span class="ch-badge live" id="badgeMaster"></span>
                <span>지휘자 (전면)</span>
            </button>
            <button id="chMasterRear" class="ch-btn" onclick="selectViewerChannel('master-rear')">
                <span>합창단 (후면)</span>
            </button>
        </div>

        <!-- 4. 지휘자용 스텔스 타이머 덱 -->
        <div id="stealthDeck">
            <div class="chrono-box">
                <div id="realClock" class="real-clock">00:00:00</div>
                <div id="elapsedTimer" class="elapsed-timer">00:00</div>
                <div class="timer-controls">
                    <button class="timer-btn" onclick="toggleChrono()" id="chronoToggleBtn">PAUSE</button>
                    <button class="timer-btn" onclick="resetChrono()">RESET</button>
                </div>
                <div id="stealthNoteBar">
                    MEMO: <span id="stealthNoteText">—</span>
                </div>
                <div class="stealth-pip-hint">HOLD TIMER NUMBERS TO PEEK MONITOR</div>
            </div>
        </div>

        <!-- 5. 메인 비디오 스테이지 -->
        <div id="videoStage">
            <video id="remoteVideo" autoplay playsinline></video>
        </div>

        <!-- PIP 컨테이너 -->
        <div id="pipContainer">
            <div id="pipBox" class="pip-card hidden-pip" onclick="swapMainAndPip()">
                <video id="localVideo" autoplay playsinline muted></video>
                <div class="pip-label" id="pipLabel">CAM</div>
            </div>
        </div>

        <!-- 타이머 홀드 시 순간적으로 보여주는 Peek 오버레이 -->
        <div id="peekOverlay">
            <video id="peekVideo" autoplay playsinline muted></video>
            <div class="peek-caption">RELEASE TO RETURN TO TIMER</div>
        </div>

        <!-- 완전 암전(Blackout) 오버레이 -->
        <div id="blackoutOverlay" onclick="handleBlackoutTap()">
            <div class="blackout-dot"></div>
        </div>

        <!-- 모니터용 우측 컨트롤 툴바 -->
        <div id="viewerTools">
            <button class="tool-circle" onclick="rotateRemoteVideo()" title="90도 회전">
                <span class="material-symbols-rounded">rotate_right</span>
            </button>
            <button class="tool-circle" onclick="zoomRemoteVideo()" id="zoomBtn" title="확대 배율">
                1x
            </button>
            <button class="tool-circle" onclick="mirrorRemoteVideo()" title="좌우반전">
                <span class="material-symbols-rounded">flip</span>
            </button>
        </div>

        <!-- 플로팅 알림 -->
        <div id="floatingMsg"></div>

        <!-- 무음 메모 입력창 -->
        <div id="notePopup">
            <input type="text" id="noteInput" placeholder="무음 메모 전송..." onkeypress="if(event.key==='Enter') sendNote()">
            <button class="note-send-btn" onclick="sendNote()">SEND</button>
        </div>

        <!-- 6. 하단 컨트롤 독 (아이폰 12 미니에서도 한 줄에 쏙 들어오는 컴팩트 버튼!) -->
        <div id="bottomDock">
            <!-- 공통: 스피커 켜기/끄기 -->
            <button id="btnSpeaker" class="dock-btn safe-muted" onclick="toggleRemoteAudio()">
                <span class="material-symbols-rounded" id="iconSpeaker">volume_off</span>
                <span id="labelSpeaker">MUTE</span>
            </button>

            <!-- 공통: 내 마이크 켜기/끄기 -->
            <button id="btnMic" class="dock-btn" onclick="toggleLocalMic()">
                <span class="material-symbols-rounded" id="iconMic">mic</span>
                <span id="labelMic">MIC</span>
            </button>

            <!-- 공통: PIP 켜기/끄기 -->
            <button id="btnPipToggle" class="dock-btn" onclick="togglePipVisibility()">
                <span class="material-symbols-rounded" id="iconPip">picture_in_picture_alt</span>
                <span id="labelPip">PIP</span>
            </button>

            <!-- 마스터 전용: 카메라 센서 선택 -->
            <button id="btnCam" class="dock-btn master-only" onclick="openCamModal()">
                <span class="material-symbols-rounded">videocam</span>
                <span id="labelCam">CAM</span>
            </button>

            <!-- 마스터 전용: 합창 원음 모드 -->
            <button id="btnMusicMode" class="dock-btn master-only" onclick="toggleMusicAudioMode()">
                <span class="material-symbols-rounded">graphic_eq</span>
                <span id="labelMusicMode">RAW</span>
            </button>

            <!-- 공통: 메모 보내기 -->
            <button class="dock-btn" onclick="toggleNotePopup()">
                <span class="material-symbols-rounded">edit_note</span>
                <span>MEMO</span>
            </button>
        </div>

        <!-- 카메라 센서 선택 모달 -->
        <div id="camModal" class="modal-backdrop" onclick="if(event.target===this) closeCamModal()">
            <div class="modal-box">
                <div class="modal-title">
                    <span>SELECT CAMERA</span>
                    <span style="cursor:pointer;" onclick="closeCamModal()">✕</span>
                </div>
                <div class="cam-list" id="camListContainer"></div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js?v=39"></script>
</body>
</html>
